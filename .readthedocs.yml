version: 2

build:
    os: "ubuntu-24.04"            # was: "ubuntu-lts-latest"
    tools:
        python: "miniforge3-latest" # was: "mambaforge-latest", now depricated

sphinx:
    configuration: "docs/source/conf.py"

conda:
    environment: "docs/environment.yml"

python:
    install:
        - method: pip
          path: .
          extra_requirements:
              - dev
